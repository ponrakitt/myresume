<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Showroom – เลือกดีไซน์ แล้วสั่ง AI สร้างเว็บ</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f5f2;--card:#fff;--tx:#1c1b1a;--mut:#6b6862;--ac:#5b4bff;--acs:#ece9ff;--bd:#e2dfd8;--on:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141416;--card:#1e1e22;--tx:#f2f1ee;--mut:#a09d97;--ac:#8f84ff;--acs:#2a2748;--bd:#34343a;--on:#101012;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141416;--card:#1e1e22;--tx:#f2f1ee;--mut:#a09d97;--ac:#8f84ff;--acs:#2a2748;--bd:#34343a;--on:#101012;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 "Noto Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:960px;margin:0 auto;padding:20px 16px 60px}
header{padding:12px 0 8px}
h1{margin:0;font-size:2rem;letter-spacing:-.02em}
h1 span{color:var(--ac)}
.sub{color:var(--mut);margin:4px 0 0}
.box{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-top:16px}
.box h2{margin:0 0 10px;font-size:1.05rem}
label{display:block;font-size:.85rem;color:var(--mut);margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px 12px}
textarea{min-height:84px;resize:vertical}
.row{display:grid;grid-template-columns:1fr;gap:0 12px}
@media(min-width:640px){.row{grid-template-columns:1fr 1fr}}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;margin-top:16px}
.tab{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:999px;padding:8px 14px;font:inherit;font-size:.9rem;cursor:pointer}
.tab.on{background:var(--ac);color:var(--on);border-color:var(--ac)}
.tab small{opacity:.8}
.intro{color:var(--mut);font-size:.92rem;margin:0 0 10px}
.grid{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:640px){.grid{grid-template-columns:1fr 1fr}}
.item{text-align:left;font:inherit;color:var(--tx);background:var(--card);border:2px solid var(--bd);border-radius:14px;padding:12px 14px;cursor:pointer;display:block;width:100%}
.item b{display:block}
.item span{display:block;color:var(--mut);font-size:.88rem;margin-top:2px}
.item.on{border-color:var(--ac);background:var(--acs)}
.item.on b::before{content:"";display:inline-block;width:14px;height:14px;margin-right:6px;vertical-align:-2px;background:var(--ac);-webkit-mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><path d='M20 6 9 17l-5-5'/></svg>") center/contain no-repeat;mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><path d='M20 6 9 17l-5-5'/></svg>") center/contain no-repeat}
.ic{vertical-align:-3px;margin-right:6px;flex:none}
.item[hidden]{display:none}
.sw{display:flex;gap:4px;margin-top:8px}
.sw i{width:22px;height:22px;border-radius:50%;border:1px solid var(--bd)}
.out{white-space:pre-wrap;word-break:break-word;background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:14px;font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;max-height:420px;overflow:auto}
.btns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn{font:inherit;font-weight:600;border:0;border-radius:10px;padding:10px 16px;cursor:pointer;background:var(--ac);color:var(--on)}
.btn.g{background:var(--acs);color:var(--tx)}
.hint{font-size:.85rem;color:var(--mut);margin-top:8px}
.pvl{font-size:.85rem;color:var(--mut);margin:0 0 6px}.pvw{border:1px solid var(--bd);border-radius:12px;overflow:hidden;margin-bottom:12px;font-size:12px}.pvw .c3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:0 12px 12px}
.sel2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px;margin-bottom:10px}
.soonc{border:2px dashed var(--bd);border-radius:14px;padding:12px 14px;opacity:.9}.soonc b{display:block}.soonc span{color:var(--mut);font-size:.88rem}.soonc .badge{display:inline-block;background:var(--acs);color:var(--ac);border-radius:999px;padding:1px 8px;font-size:.72rem;font-weight:700;margin-left:6px}
.sg{margin-top:14px}.sgh{display:flex;align-items:center;gap:8px;font-size:.8rem;font-weight:700;color:var(--mut);letter-spacing:.04em;text-transform:uppercase;margin-bottom:8px}.sgh span{background:var(--bd);border-radius:999px;padding:0 8px;font-size:.72rem}
.sgl{display:grid;grid-template-columns:1fr;gap:8px}@media(min-width:640px){.sgl{grid-template-columns:1fr 1fr}}
.soonc{display:flex;gap:12px;align-items:flex-start;opacity:1}.soi{flex:none;width:36px;height:36px;border-radius:10px;background:var(--acs);color:var(--ac);display:flex;align-items:center;justify-content:center}.soi .ic{margin:0}
.sot b{display:flex;flex-wrap:wrap;align-items:center;gap:6px}.sot .badge{margin-left:0}.sot>span{display:block;margin-top:2px}
@keyframes fh{from{transform:translateY(26px);opacity:0}30%{opacity:1}to{transform:translateY(-30px);opacity:0}}@keyframes rn{50%{transform:translate(20px,-8px)}}
.lvt{font-size:1.05rem;font-weight:700;margin-bottom:6px}
.bzb{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.bcard{border:1px solid var(--bd);border-radius:14px;padding:12px;margin-top:10px}.bsw{display:flex;height:34px;border-radius:8px;overflow:hidden;border:1px solid var(--bd);margin:8px 0}.bsw i{flex:1}.btb{font:12px/1.6 ui-monospace,Menlo,monospace;color:var(--mut)}#bc button.o.sel{border-color:var(--ac);background:var(--acs)}#bc .hint{margin:6px 0}#bc input{margin-top:6px}
.cw{margin-top:12px;border:2px solid #e6a100;background:rgba(230,161,0,.1);border-radius:14px;padding:12px 14px}.cw[hidden]{display:none}.cwt{display:flex;align-items:center;gap:6px;font-weight:700;color:#d99400}.cwt .ic{margin:0}.cwi{margin-top:10px;padding-top:10px;border-top:1px dashed rgba(230,161,0,.5)}.cwi b{display:block}.cwi span{display:block;color:var(--mut);font-size:.9rem;margin:2px 0 6px}.cwi .btn{padding:5px 10px;font-size:.8rem;margin:0 6px 6px 0}.item.cf{border-color:#e6a100}.item.cf b .ic{color:#e6a100;margin:0 0 0 6px}.lvh{margin:16px 0 2px;padding-top:10px;border-top:1px dashed var(--bd);font-weight:700;color:var(--ac)}
#qz,#bz{position:fixed;inset:0;z-index:1001;background:rgba(10,10,20,.72);display:flex;align-items:center;justify-content:center;padding:16px}#qz[hidden],#bz[hidden]{display:none}
#qc,#bc{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:18px;padding:18px;width:100%;max-width:420px;max-height:90vh;overflow:auto}#qc button.o,#bc button.o{display:block;width:100%;text-align:left;margin-top:8px;font:inherit;color:var(--tx);background:var(--bg);border:2px solid var(--bd);border-radius:12px;padding:12px;cursor:pointer}
.sv-row{display:flex;gap:6px;align-items:center;margin-top:6px}.sv-row span{flex:1;word-break:break-all}.sv-row .btn{padding:6px 12px}
@keyframes dt{50%{transform:translateY(-4px);opacity:.4}}
.lang{flex-wrap:wrap;justify-content:flex-end}
#tvb{position:fixed;inset:0;z-index:998}
#tvh{position:fixed;z-index:999;pointer-events:none;border-radius:16px;box-shadow:0 0 0 9999px rgba(10,10,20,.72),0 0 0 3px var(--ac),0 0 24px 6px var(--ac);transition:all .3s ease;animation:pls 1.6s ease-in-out infinite}
@keyframes pls{50%{box-shadow:0 0 0 9999px rgba(10,10,20,.72),0 0 0 6px var(--ac),0 0 34px 10px var(--ac)}}
#tt{position:fixed;z-index:1000;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:16px;padding:14px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
#tt p{margin:6px 0 0;color:var(--mut);font-size:.92rem}#tn{font-size:.78rem;color:var(--ac);font-weight:700}
.add{margin-top:14px;border-top:1px dashed var(--bd);padding-top:10px}.add summary{cursor:pointer;color:var(--ac);font-weight:600}.add input{margin-top:8px}.add .btn{margin-top:8px}
@keyframes pg{from{transform:scaleX(0)}to{transform:scaleX(1)}}@keyframes sk{to{background-position:-200% 0}}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.lang{display:flex;gap:6px;padding-top:6px}.lang .tab{padding:6px 12px}
.ft{text-align:center;color:var(--mut);font-size:.85rem;margin-top:28px;padding-top:16px;border-top:1px solid var(--bd)}.ft a{color:var(--ac);text-decoration:none;font-weight:600}
.st{height:70px;display:flex;align-items:center;justify-content:center;border-radius:8px;margin-top:8px;overflow:hidden}
.st div{padding:10px 18px;border-radius:10px;font:600 14px sans-serif}
.wf{display:flex;flex-direction:column;gap:3px;height:70px;padding:6px;margin-top:8px;background:var(--bg);border:1px solid var(--bd);border-radius:8px}
.wf i{display:block;background:var(--bd);border-radius:3px;font-style:normal}
.cd{margin:8px 0 0;padding:10px;background:#1b1b22;color:#9ef0c0;border-radius:8px;font:12px/1.5 ui-monospace,Menlo,monospace;white-space:pre-wrap}
.pill{background:var(--ac);color:var(--on);padding:8px 16px;border-radius:999px;font:600 13px sans-serif}
.pxw{position:relative;width:80%;height:50px;overflow:hidden;background:var(--bd);border-radius:8px}
.pxw u{position:absolute;left:0;width:200%}
.pb{bottom:0;height:50%;background:repeating-linear-gradient(90deg,#9a93ff 0 20px,transparent 20px 50px);opacity:.5;animation:mvb 3s linear infinite}
.pf{bottom:0;height:25%;background:repeating-linear-gradient(90deg,var(--ac) 0 20px,transparent 20px 40px);animation:mvf 1s linear infinite}
.ss{top:0;height:140px;background:repeating-linear-gradient(var(--ac) 0 10px,transparent 10px 22px);animation:sc 2.5s ease-in-out infinite alternate}
.mq{width:90%;overflow:hidden;white-space:nowrap}.mq span{display:inline-block;font-weight:700;animation:mq 5s linear infinite}
.tw{font:600 16px ui-monospace,monospace;overflow:hidden;white-space:nowrap;border-right:2px solid var(--ac);width:14ch;animation:ty 3s steps(14) infinite}
.spin{width:28px;height:28px;border:4px solid var(--bd);border-top-color:var(--ac);border-radius:50%;animation:rt 1s linear infinite}
.ct{font:700 24px sans-serif;color:var(--ac)}
@keyframes mvb{to{transform:translateX(-50px)}}@keyframes mvf{to{transform:translateX(-40px)}}
@keyframes sc{to{transform:translateY(-80px)}}@keyframes mq{from{transform:translateX(100%)}to{transform:translateX(-100%)}}
@keyframes ty{from{width:0}60%,to{width:14ch}}@keyframes rt{to{transform:rotate(360deg)}}
@keyframes fd{0%{opacity:0;transform:translateY(8px)}50%,100%{opacity:1;transform:none}}
@keyframes bob{50%{transform:translateY(-6px);box-shadow:0 8px 12px rgba(0,0,0,.25)}}
@keyframes mi{50%{transform:scale(.88)}}@keyframes ag{to{background-position:300% 0}}
.st .spin{padding:0;border-radius:50%}.st .ct{font:700 24px sans-serif;padding:0}.st .tw{font:600 16px ui-monospace,monospace;padding:0 2px 0 0;border-radius:0}.st .mq{padding:0;border-radius:0}.st .pill{border-radius:999px}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="top"><h1>Show<span>room</span></h1><div class="lang"><button class="tab" data-l="th">ไทย</button><button class="tab" data-l="en">EN</button><button class="tab" id="tourBtn"></button></div></div>
  <p class="sub">เลือกสไตล์ เลย์เอาต์ สี และส่วนประกอบของเว็บ พร้อมคำอธิบายทุกอย่าง แล้วระบบจะสร้าง Prompt ให้คัดลอกไปสั่ง AI ได้ทันที</p>
</header>

<section class="box">
  <h2>1) ข้อมูลเว็บของคุณ</h2>
  <div class="row">
    <div><label for="name">ชื่อเว็บ / ธุรกิจ</label><input id="name" placeholder="เช่น ร้านกาแฟบ้านสวน"></div>
    <div><label for="type">ประเภทเว็บ</label>
      <select id="type"></select></div>
  </div>
  <label for="note">รายละเอียดเพิ่มเติม (กลุ่มเป้าหมาย เนื้อหา ฟีเจอร์พิเศษ)</label>
  <textarea id="note" placeholder="เช่น ขายกาแฟคั่วบด กลุ่มลูกค้าวัยทำงาน อยากให้ดูอบอุ่น มีปุ่มสั่งซื้อผ่าน LINE"></textarea>
</section>

<section>
  <div style="margin-top:16px"><button class="btn" id="rnd" style="width:100%;font-size:1rem;padding:14px"></button><button class="btn g" id="qzb" style="width:100%;font-size:1rem;padding:14px;margin-top:8px"></button></div>
  <div class="tabs" id="presets" style="margin-top:12px"></div>
  <div class="tabs" id="tabs" role="tablist" style="margin-top:0"></div>
  <div class="box" style="margin-top:0">
    <input id="q" type="search" placeholder="ค้นหาในหมวดนี้..." style="margin-bottom:10px">
    <p class="intro" id="intro"></p><div id="bzw"></div>
    <div class="grid" id="grid"></div>
    <div class="cw" id="cw" hidden></div>
    <details class="add"><summary id="addT"></summary><input id="cn"><input id="cd"><button class="btn g" id="ca"></button></details>
  </div>
</section>

<section class="box" id="lvBox" hidden></section>
<section class="box" id="beBox" hidden></section>
<section class="box" id="peBox" hidden></section>
<section class="box" id="icBox" hidden></section>

<section class="box">
  <h2>2) Prompt สำหรับสั่ง AI</h2>
  <p class="pvl" id="pvl"></p><div class="pvw" id="pvw"></div>
  <div class="sel2"><div><label for="tg" id="tgl"></label><select id="tg"></select></div><div><label for="ln" id="lnl"></label><select id="ln"></select></div></div>
  <div class="out" id="out"></div>
  <div class="btns">
    <button class="btn" id="copy">คัดลอก Prompt</button>
    <button class="btn g" id="clear">ล้างที่เลือก</button>
  </div>
  <p class="hint" id="hint"></p>
  <details class="add" id="sv"><summary id="svT"></summary><input id="sn"><div class="btns"><button class="btn g" id="ss"></button><button class="btn g" id="sh"></button></div><p class="hint" id="sm"></p><div id="sl"></div><input id="sc" style="margin-top:10px"><button class="btn g" id="sg" style="margin-top:8px"></button></details>
</section>
<section class="box"><h2 id="soonT"></h2><p class="pvl" id="soonI"></p><div id="soon"></div></section>
<footer class="ft" id="ft"></footer>
</div>

<script>
var IC={compare:'<rect x="3" y="4" width="8" height="16" rx="1"/><rect x="13" y="4" width="8" height="16" rx="1"/>',undo:'<path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-15-6.7L3 13"/>',gauge:'<path d="M12 14l4-4"/><path d="M3.3 17a10 10 0 1 1 17.4 0"/>',rows:'<rect x="3" y="3" width="18" height="6" rx="1"/><rect x="3" y="15" width="18" height="6" rx="1"/>',eye:'<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',shield:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/>',heart:'<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/>',mail:'<rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/>',dice:'<rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1"/><circle cx="15.5" cy="8.5" r="1"/><circle cx="8.5" cy="15.5" r="1"/><circle cx="15.5" cy="15.5" r="1"/>',compass:'<circle cx="12" cy="12" r="10"/><polygon points="16.2 7.8 14.1 14.1 7.8 16.2 9.9 9.9 16.2 7.8"/>',help:'<circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3"/><path d="M12 17h.01"/>',save:'<path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8"/><path d="M7 3v5h8"/>',link:'<path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/>',sparkles:'<path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 3v4M17 5h4"/><path d="M5 17v4M3 19h4"/>',lock:'<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',chat:'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',check:'<path d="M20 6 9 17l-5-5"/>',x:'<path d="M18 6 6 18M6 6l12 12"/>',palette:'<circle cx="13.5" cy="6.5" r="1"/><circle cx="17.5" cy="10.5" r="1"/><circle cx="8.5" cy="7.5" r="1"/><circle cx="6.5" cy="12.5" r="1"/><path d="M12 2a10 10 0 1 0 0 20 2 2 0 0 0 1.6-3.2 2 2 0 0 1 1.6-3.2H18a4 4 0 0 0 4-4C22 6 17.5 2 12 2z"/>',warn:'<path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/>',download:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/>',corner:'<path d="M3 21V11a8 8 0 0 1 8-8h10"/>',sparkle:'<path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/>',pen:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',file:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/>'};
function ic(n,s){s=s||16;return '<svg class="ic" viewBox="0 0 24 24" width="'+s+'" height="'+s+'" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+IC[n]+'</svg>'}
var TYPES=["เว็บไซต์ธุรกิจ / Landing Page","ร้านค้าออนไลน์","พอร์ตโฟลิโอ","บล็อก / ข่าว","Dashboard / ระบบหลังบ้าน","เว็บอีเวนต์ / งานเทศกาล","เว็บแอปพลิเคชัน","อื่น ๆ"];
var CATS=[
{k:"style",t:"สไตล์",intro:"บุคลิกภาพโดยรวมของหน้าตาเว็บ เลือกได้หลายแบบผสมกัน",items:[
["Minimalist","เรียบง่าย พื้นที่ว่างเยอะ ใช้สีน้อย เน้นเนื้อหา ดูสะอาดและทันสมัย"],
["Glassmorphism","การ์ดโปร่งแสงเหมือนกระจกฝ้า มีเบลอพื้นหลัง ดูล้ำและนุ่มนวล"],

function tabs(){
  $("tabs").innerHTML=CATS.map(function(c,i){

    return '<button class="tab'+(i==cur?' on':'')+'" data-i="'+i+'">'+c.t+(n?' <small>('+n+')</small>':'')+'</button>';

function grid(){
  var c=CATS[cur],q=$("q").value.trim().toLowerCase();
  $("intro").textContent=c.intro;
  $("grid").innerHTML=c.items.map(function(it,i){
    var show=!q||(it[0]+it[1]).toLowerCase().indexOf(q)>-1;
    var sw=it[2]?'<div class="sw">'+it[2].map(function(h){return '<i style="background:'+h+'"></i>'}).join("")+'</div>':'';
    return '<button class="item'+(sel[c.k][i]?' on':'')+'" data-i="'+i+'"'+(show?'':' hidden')+'><b>'+it[0]+'</b><span>'+it[1]+'</span>'+sw+pv(c.k,it)+'</button>';
  }).join("");
}
function build(){
  var L=["คุณคือ UI/UX Designer และ Front-end Developer ระดับมืออาชีพ ช่วยออกแบบและเขียนเว็บไซต์ตามรายละเอียดด้านล่างนี้ ให้โค้ดครบสมบูรณ์ พร้อมใช้งานทันที",""];
  L.push("## ข้อมูลเว็บ");
  L.push("- ชื่อเว็บ: "+($("name").value.trim()||"(ยังไม่ระบุ)"));
  L.push("- ประเภท: "+$("type").value);
  if($("note").value.trim())L.push("- รายละเอียดเพิ่มเติม: "+$("note").value.trim());
  var total=0;
  CATS.forEach(function(c){
    var ks=Object.keys(sel[c.k]);
    if(!ks.length)return;
    L.push("","## "+c.t);
    ks.forEach(function(i){var it=c.items[i];total++;L.push("- "+it[0]+": "+it[1]+(it[2]?" (สี: "+it[2].join(", ")+")":""))});
  });
  L.push("","## เงื่อนไขการตอบ","- เขียนโค้ดให้สะอาด มีคอมเมนต์สำคัญ","- ใช้เนื้อหาตัวอย่างภาษาไทยที่สมจริง ไม่ใช้ Lorem ipsum","- หากข้อมูลส่วนไหนไม่ชัดเจน ให้เลือกแบบที่เหมาะสมที่สุดและบอกสิ่งที่ตัดสินใจเอง");
  $("out").textContent=L.join("\n");
  $("hint").textContent=total?"เลือกแล้ว "+total+" รายการ":"ยังไม่ได้เลือกรายการ เลือกจากแท็บด้านบนได้เลย";
  tabs();
}

function h2r(h,s,l){h=((h%360)+360)%360;s/=100;l/=100;var a=s*Math.min(l,1-l);function f(n){var k=(n+h/30)%12;return l-a*Math.max(-1,Math.min(k-3,9-k,1))}return [f(0),f(8),f(4)].map(function(x){return Math.round(x*255)})}
function hx(h,s,l){return '#'+h2r(h,s,l).map(function(x){return ('0'+x.toString(16)).slice(-2)}).join('')}
function r2h(c){var r=c[0]/255,g=c[1]/255,b=c[2]/255,mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,d=mx-mn,h=0,s=0;if(d){s=d/(1-Math.abs(2*l-1));h=mx==r?((g-b)/d)%6:mx==g?(b-r)/d+2:(r-g)/d+4;h*=60;if(h<0)h+=360}return [h,s*100,l*100]}
function lum(x){var c=[1,3,5].map(function(i){var v=parseInt(x.substr(i,2),16)/255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*c[0]+.7152*c[1]+.0722*c[2]}
function crt(a,b){var x=lum(a),y=lum(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05)}
