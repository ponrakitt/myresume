<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FA-LIMS</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eceeea;--ink:#16231f;--mute:#66756f;--pcb:#0b3d33;--pcb2:#12594a;--cu:#c0762f;--line:#d3d9d3;--card:#fbfcfa}
*{box-sizing:border-box}
body{margin:0;font:16px/1.55 Sarabun,system-ui,sans-serif;background:var(--bg);color:var(--ink);display:grid;grid-template-columns:232px 1fr;min-height:100vh}
body.auth{grid-template-columns:1fr}body.auth aside{display:none}body.auth main{padding:0;max-width:none}
aside{position:sticky;top:0;height:100vh;background:var(--pcb) repeating-linear-gradient(to bottom,transparent 0 43px,#ffffff10 43px 44px);color:#fff;padding:22px 12px;display:flex;flex-direction:column;gap:4px}
.brand{padding:0 10px 18px}.brand b{display:block;font-size:22px}.brand small{color:#9fc4b9;font-size:13px}
aside button{height:40px;background:none;border:0;border-left:3px solid transparent;color:#c4ded5;text-align:left;padding:0 12px;border-radius:0 6px 6px 0;font:inherit;cursor:pointer;transition:background .15s}
aside button:hover{background:#ffffff14;color:#fff}
aside button.on{background:#ffffff1f;color:#fff;border-left-color:var(--cu);font-weight:600}
#who{margin-top:auto;display:flex;flex-direction:column;gap:2px;padding-top:12px;border-top:1px solid #ffffff22}
.me{padding:0 12px 6px;font-size:14px;color:#c4ded5}.me b{display:block;color:#fff;font-size:15px}
main{padding:30px 38px;max-width:1120px;width:100%}
h1{margin:0 0 18px;font-size:26px;font-weight:700;letter-spacing:-.01em}h2{font-size:18px;margin:24px 0 10px}
table{width:100%;border-collapse:separate;border-spacing:0;background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
th{font-weight:600;font-size:14px;color:var(--mute);background:#e5e9e4}
tr.k{cursor:pointer;transition:background .12s}tr.k:hover{background:#e9f1ed}
.sn{font:600 13px 'IBM Plex Mono',ui-monospace,Menlo,monospace;border:1.5px solid var(--ink);border-radius:3px;padding:1px 8px 1px 10px;background:#fff;box-shadow:inset 3px 0 0 var(--cu);white-space:nowrap}
.chip{--led:#8c9893;display:inline-flex;align-items:center;gap:7px;padding:2px 11px 2px 9px;border-radius:99px;background:#e3e8e3;font-size:14px;white-space:nowrap}
.chip:before{content:"";width:9px;height:9px;border-radius:50%;background:var(--led);box-shadow:0 0 0 3px color-mix(in srgb,var(--led) 25%,transparent)}
.s1{--led:#e0a21b}.s2{--led:#3a82d6}.s3{--led:#2fb36d}.late{--led:#d9462f;background:#f7ddd7;color:#7d2412}
button,input,select,textarea{font:inherit}
button{padding:8px 16px;border:1px solid var(--line);background:#fff;border-radius:6px;cursor:pointer;transition:background .15s}
button:hover{background:#eef2ee}
button.pri{background:var(--pcb2);color:#fff;border-color:var(--pcb2)}button.pri:hover{background:var(--pcb)}
button.x{color:#a3441a}button.full{width:100%;padding:10px;margin-top:6px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.box{background:var(--card);border:1px solid var(--line);padding:16px;border-radius:8px}
.box>b{display:block;margin-bottom:6px}
.big{font:600 34px 'IBM Plex Mono',monospace;line-height:1.1}
.row{display:flex;gap:8px;margin-top:14px;justify-content:flex-end}
.meter{display:flex;align-items:center;gap:10px;margin:8px 0}.meter span:first-child{width:104px}
.meter .t{flex:1;height:10px;background:#dde3dd;border-radius:5px;overflow:hidden}.meter i{display:block;height:100%;background:var(--pcb2)}
.warn{color:#a3441a;font-weight:600}
label{display:block;margin:10px 0;font-weight:600;font-size:14px}
label input,label select,label textarea{display:block;width:100%;padding:9px 10px;border:1px solid #c5ccc5;border-radius:6px;font-weight:400;margin-top:4px;background:#fff}
label input:focus,label select:focus,label textarea:focus{border-color:var(--pcb2);outline:2px solid #12594a33}
dialog{border:0;border-radius:10px;padding:22px;width:min(480px,92vw);box-shadow:0 12px 48px #0006;background:var(--card);color:var(--ink)}
dialog[open]{animation:pop .18s ease-out}@keyframes pop{from{opacity:0;transform:scale(.97)}}
dialog::backdrop{background:#0b1f1a99}
.ph{display:flex;gap:8px;flex-wrap:wrap}.ph img{height:96px;border:1px solid var(--line);border-radius:6px}
#t{position:fixed;bottom:20px;right:20px;background:var(--ink);color:#fff;padding:11px 18px;border-radius:8px;display:none;max-width:80vw}
.log{font-size:14px;color:var(--mute)}
.authwrap{display:grid;grid-template-columns:1.1fr 1fr;min-height:100vh}
.hero{background:var(--pcb) repeating-linear-gradient(to bottom,transparent 0 43px,#ffffff10 43px 44px);color:#fff;padding:56px;display:flex;flex-direction:column;justify-content:space-between;gap:32px}
.hero h1{font-size:44px;margin:0 0 12px}.hero p{max-width:32ch;color:#c4ded5;margin:0}
.hero ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.hero .chip{background:#ffffff18;color:#fff}
.panel{align-self:center;justify-self:center;width:min(380px,88vw);padding:24px 0}
.panel h2{margin:0 0 14px;font-size:24px}.alt{text-align:center;font-size:14px;margin:14px 0 0}.alt a{color:var(--pcb2)}
:focus-visible{outline:2px solid var(--cu);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:800px){body{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;background-image:none;padding:12px}aside button{border-left:0;border-radius:6px}.brand{padding:0 8px 0 0}.brand small{display:none}#who{margin:0;border:0;padding:0;flex-direction:row;align-items:center}.me{display:none}main{padding:18px}.wide{overflow-x:auto}.authwrap{grid-template-columns:1fr}.hero{padding:28px}.hero h1{font-size:32px}}

:root[data-theme=dark]{--bg:#0e1614;--ink:#e4eee9;--mute:#8da39a;--line:#25352f;--card:#16211e;--pcb:#07251f;--pcb2:#1c8a6f}
[data-theme=dark] th{background:#1c2a26}[data-theme=dark] tr.k:hover{background:#1f302b}
[data-theme=dark] button,[data-theme=dark] label input,[data-theme=dark] label select,[data-theme=dark] label textarea{background:#1b2824;color:var(--ink);border-color:var(--line)}
[data-theme=dark] button:hover{background:#243630}[data-theme=dark] button.pri{background:var(--pcb2);color:#fff}
[data-theme=dark] aside button{background:none;color:#c4ded5}[data-theme=dark] aside button:hover{background:#ffffff14}[data-theme=dark] aside button.on{background:#ffffff1f}
[data-theme=dark] .chip,[data-theme=dark] .meter .t,[data-theme=dark] .col{background:#1e2d28}[data-theme=dark] .sn{background:#101a17;border-color:#8da39a}
[data-theme=dark] .late{background:#3a1d17;color:#f3b4a6}[data-theme=dark] #pr button:hover,[data-theme=dark] #pr button.on{background:#22322d}
@keyframes up{from{opacity:0;transform:translateY(8px)}}
@keyframes pulse{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--led) 10%,transparent)}}
@keyframes grow{from{width:0}}
.fade{animation:up .28s ease-out}
tr.k,.card{animation:up .35s ease-out both;animation-delay:calc(var(--i,0)*35ms)}
.chip.s1:before{animation:pulse 1.8s ease-in-out infinite}.late:before{animation:pulse 1s ease-in-out infinite}
.meter i{animation:grow .9s cubic-bezier(.2,.8,.2,1) both}
.kpis .box{border-top:3px solid var(--line);transition:transform .15s}.kpis .box:hover{transform:translateY(-2px)}.kpi.bad{border-top-color:#d9462f}.kpi.amb{border-top-color:#e0a21b}
.tool{gap:6px}.search{flex:1 1 220px;min-width:180px;padding:9px 14px;border:1px solid var(--line);border-radius:99px;background:var(--card);color:var(--ink)}
.pill{border-radius:99px;padding:5px 13px;font-size:14px}.pill.on,.seg .on{background:var(--pcb2);color:#fff;border-color:var(--pcb2)}
.seg{margin-left:auto;display:inline-flex}.seg button{border-radius:0}.seg button:first-child{border-radius:6px 0 0 6px}.seg button:last-child{border-radius:0 6px 6px 0}
.board{display:grid;grid-template-columns:repeat(4,minmax(210px,1fr));gap:12px;overflow-x:auto}
.col{background:#e3e8e3;border-radius:8px;padding:10px;min-height:160px;display:flex;flex-direction:column;gap:8px}.col.over{outline:2px dashed var(--cu)}
.colh{display:flex;justify-content:space-between;align-items:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:10px;cursor:grab;display:flex;flex-direction:column;gap:3px;transition:transform .15s}.card:hover{transform:translateY(-2px)}.card:active{cursor:grabbing}
.empty{text-align:center;color:var(--mute)}
.stepper{display:flex;margin:16px 0 8px}.st{flex:1;text-align:center;position:relative;font-size:13px;color:var(--mute)}
.st i{display:block;width:16px;height:16px;border-radius:50%;background:var(--line);margin:0 auto 4px;position:relative;z-index:1;transition:background .4s}
.st:not(:last-child):after{content:"";position:absolute;top:7px;left:50%;width:100%;height:2px;background:var(--line)}
.st.ok i,.st.ok:not(:last-child):after{background:var(--pcb2)}.st b{display:block;color:var(--ink)}.st span{display:block}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:4px}.prog i{display:block;height:100%;background:var(--cu);animation:grow .9s both}
.tl{border-left:2px solid var(--line);margin-left:6px;padding-left:16px}.tl div{position:relative;padding-bottom:12px}.tl i{position:absolute;left:-23px;top:7px;width:10px;height:10px;border-radius:50%;background:var(--pcb2)}.tl b{display:block;font-weight:600}
button.soon{border-style:dashed;color:var(--mute);background:transparent}button.soon em{font:normal 600 11px Sarabun,sans-serif;background:var(--cu);color:#fff;border-radius:99px;padding:1px 7px;margin-left:4px}
#pal{padding:0;width:min(520px,92vw);margin-top:12vh}#pal input{width:100%;border:0;border-bottom:1px solid var(--line);padding:14px 16px;font-size:17px;background:transparent;color:var(--ink);outline:0}
#pr{padding:6px;display:flex;flex-direction:column;max-height:50vh;overflow:auto}#pr button{border:0;text-align:left;background:transparent}#pr button.on,#pr button:hover{background:#e3ede8}
kbd{font:600 11px 'IBM Plex Mono',monospace;border:1px solid #ffffff44;border-radius:3px;padding:0 5px;margin-left:6px}
.conf{position:fixed;inset:0;pointer-events:none;z-index:99}
.lnk{cursor:pointer;padding:2px 0}.lnk:hover{text-decoration:underline}
@media(max-width:800px){.board{grid-template-columns:repeat(4,230px)}}
.kpis{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}.card .sn{align-self:flex-start}
[data-theme=dark] aside button{border-color:transparent}[data-theme=dark] aside button.on{border-left-color:var(--cu)}[data-theme=dark] #t{background:#e4eee9;color:#0e1614}

.seg2{display:inline-flex;margin-bottom:12px}.seg2 button{border-radius:0}.seg2 button:first-child{border-radius:6px 0 0 6px}.seg2 button:last-child{border-radius:0 6px 6px 0}.seg2 .on{background:var(--pcb2);color:#fff;border-color:var(--pcb2)}
.qrbody{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start}.qrbody>div:last-child{flex:1;min-width:220px}
.qrimg{width:168px;height:168px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px;flex:none}.qrimg svg{width:100%;height:100%;display:block}
.tags{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}.tg{text-align:center}.tg .qrimg{width:128px;height:128px;margin:0 auto 10px}
body.mob aside{display:none}body.mob{grid-template-columns:1fr}body.mob main{padding:14px;max-width:560px;margin:0 auto}
.mtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.stbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stbtns button{padding:14px 8px;font-size:16px}.stbtns .on{background:var(--pcb2);color:#fff;border-color:var(--pcb2)}
.cam{display:flex;justify-content:center;padding:14px;border:2px dashed var(--cu);border-radius:8px;color:var(--cu);font-weight:600;cursor:pointer}.cam input{display:none}
details{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin:12px 0}summary{cursor:pointer;font-weight:600}
textarea.q{width:100%;padding:9px;border:1px solid var(--line);border-radius:6px;font:inherit;background:var(--card);color:var(--ink)}
</style>
</head>

async function login(){
  cred={email:$('#l_e').value.trim(),pass:$('#l_p').value};
  try{await api('login');sessionStorage.setItem('c',JSON.stringify(cred));view='dash';await load()}catch(e){cred=null}
}
function logout(){sessionStorage.clear();location.reload()}

function dlg(title,f,cb){
  const d=document.createElement('dialog');
  d.innerHTML=`<form method="dialog"><h2>${title}</h2>${f.map(x=>`<label>${x.l}${x.t=='textarea'?`<textarea name="${x.k}" rows="3">${esc(x.v)}</textarea>`:x.t=='select'?`<select name="${x.k}">${x.o.map(o=>`<option ${o==x.v?'selected':''}>${esc(o)}</option>`).join('')}</select>`:`<input name="${x.k}" type="${x.t||'text'}" value="${esc(x.v)}" ${x.r?'required':''}>`}</label>`).join('')}<div class="row"><button type="button" onclick="this.closest('dialog').close()">ยกเลิก</button><button class="pri">บันทึก</button></div></form>`;
  document.body.append(d);d.showModal();
  d.querySelector('form').onsubmit=e=>cb(Object.fromEntries(new FormData(e.target)));
  d.onclose=()=>d.remove();
}
function tabs(){
  if(!staff())return[['cases','เคสของฉัน']];
  const t=[['dash','ภาพรวม'],['cases','เคส'],['tags','แท็ก QR'],['inv','เครื่องมือ/สต็อก']];
  if(boss())t.push(['users','ผู้ใช้'],['set','ตั้งค่าอีเมล']);
  return t;
}
function go(v){view=v;cur=null;render()}
function render(){
  document.body.classList.toggle('auth',!S.u);document.body.classList.toggle('mob',!!(S.u&&mob));
  if(!S.u){$('#nav').innerHTML='';$('#who').innerHTML='';$('#main').innerHTML=authView();return}
  if(!tabs().some(t=>t[0]==view))view='cases';
  $('#nav').innerHTML=tabs().map(([k,l])=>`<button class="${view==k&&!cur?'on':''}" onclick="go('${k}')">${l}</button>`).join('');
  $('#who').innerHTML=`<div class="me"><b>${esc(S.u.name)}</b>${S.u.role}</div><button onclick="palOpen()">ค้นหาด่วน<kbd>Ctrl K</kbd></button><button onclick="toggleTheme()">สลับโหมดมืด/สว่าง</button><button onclick="pwDlg()">เปลี่ยนรหัสผ่าน</button><button onclick="logout()">ออกจากระบบ</button>`;
  const m=$('#main');m.innerHTML=(mob?V.m:cur?V.detail:V[view])();m.classList.remove('fade');void m.offsetWidth;m.classList.add('fade');after();
}

function newCase(){
  const eng=['-',...S.users.filter(u=>u.role=='Engineer').map(u=>u.name)];
  dlg('เปิดเคสใหม่',[{k:'customer',l:'ลูกค้า/ทีมเจ้าของงาน',v:staff()?'':S.u.name,r:1},...(staff()?[{k:'custEmail',l:'อีเมลลูกค้า',t:'email',r:1}]:[]),{k:'part',l:'ชิ้นงาน (เช่น Server PSU, DIMM)',r:1},{k:'sn',l:'Serial Number'},{k:'symptom',l:'อาการเสีย',t:'textarea'},{k:'due',l:'กำหนดเสร็จ',t:'date',r:1},...(staff()?[{k:'owner',l:'ผู้รับผิดชอบ',t:'select',o:eng}]:[])],
    f=>act('saveCase',{c:f},'เปิดเคสแล้ว'));

function saveA(id){
  const c={id};['d3','test','rc','d5','d6','d7'].forEach(k=>c[k]=$('#a_'+k).value);
  act('saveCase',{c},'บันทึกแล้ว');
}
function shrink(f){return new Promise(res=>{const im=new Image();im.onload=()=>{const r=Math.min(1,800/im.width),cv=document.createElement('canvas');cv.width=im.width*r;cv.height=im.height*r;cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);res(cv.toDataURL('image/jpeg',.75))};im.src=URL.createObjectURL(f)})}
async function addPhotos(id,files){
  busy=true;toast('กำลังอัปโหลดรูป…');
  try{for(const f of files)await api('photo',{id,img:await shrink(f)});toast('อัปโหลดแล้ว');await load()}catch(e){}
  busy=false;
}

function mailRep(id){
  const c=S.cases.find(x=>x.id==id);
  if(confirm(`ส่งรายงาน ${c.id} ไปที่ ${c.custEmail||'(ไม่มีอีเมลลูกค้า)'} และทีมแจ้งเตือน?`))act('sendReport',{id,html:rep(c)},'ส่งรายงานแล้ว');

async function check(){try{const j=await api('check');toast(j.sent?'ส่งอีเมลแจ้งเตือนแล้ว':'ไม่มีรายการที่ต้องแจ้งเตือน')}catch(e){}}

let am='login';
function goAuth(m){const e=$('#l_e')?.value;am=m;render();if(e)$('#l_e').value=e}
function authView(){
  const hero=`<section class="hero"><div><h1>FA-LIMS</h1><p>บันทึกเคส ผลวิเคราะห์ 8D สต็อก และการแจ้งเตือนของแลป Failure Analysis ไว้ในที่เดียว</p></div><ul>${ST.map((s,i)=>`<li><span class="chip s${i}">${s}</span></li>`).join('')}</ul></section>`;
  const back=`<a href="#" onclick="goAuth('login');return false">กลับไปเข้าสู่ระบบ</a>`;
  const F={
    login:`<h2>เข้าสู่ระบบ</h2><label>อีเมล<input id="l_e" type="email" autocomplete="username"></label><label>รหัสผ่าน<input id="l_p" type="password" autocomplete="current-password"></label><button class="pri full" onclick="login()">เข้าสู่ระบบ</button><p class="alt"><a href="#" onclick="goAuth('forgot');return false">ลืมรหัสผ่าน?</a></p>`,
    forgot:`<h2>ลืมรหัสผ่าน</h2><p class="log">กรอกอีเมลของบัญชี ระบบจะส่งรหัสยืนยัน 8 ตัวอักษรให้ทางอีเมล ใช้ได้ 15 นาที</p><label>อีเมล<input id="l_e" type="email"></label><button class="pri full" onclick="forgot()">ส่งรหัสยืนยัน</button><p class="alt"><a href="#" onclick="goAuth('reset');return false">มีรหัสยืนยันแล้ว</a> · ${back}</p>`,
    reset:`<h2>ตั้งรหัสผ่านใหม่</h2><label>อีเมล<input id="l_e" type="email"></label><label>รหัสยืนยันจากอีเมล<input id="l_c" autocomplete="one-time-code"></label><label>รหัสผ่านใหม่ (อย่างน้อย 8 ตัว)<input id="l_p" type="password" autocomplete="new-password"></label><label>ยืนยันรหัสผ่านใหม่<input id="l_p2" type="password" autocomplete="new-password"></label><button class="pri full" onclick="resetPw()">ตั้งรหัสผ่านใหม่</button><p class="alt">${back}</p>`};
  return `<div class="authwrap">${hero}<section class="panel" onkeydown="if(event.key=='Enter')({login,forgot,reset:resetPw}[am])()">${F[am]}</section></div>`;
}
async function forgot(){
  const email=$('#l_e').value.trim();if(!email)return toast('กรอกอีเมลก่อน');
  try{await api('forgot',{email});toast('ถ้ามีบัญชีนี้ในระบบ จะส่งรหัสยืนยันไปทางอีเมล');goAuth('reset')}catch(e){}
}
async function resetPw(){
  const p=$('#l_p').value;if(p!=$('#l_p2').value)return toast('รหัสผ่านใหม่ทั้งสองช่องไม่ตรงกัน');
  try{await api('reset',{email:$('#l_e').value.trim(),code:$('#l_c').value,newPass:p});toast('ตั้งรหัสผ่านใหม่แล้ว เข้าสู่ระบบได้เลย');am='login';render()}catch(e){}
}
function pwDlg(){
  dlg('เปลี่ยนรหัสผ่าน',[{k:'old',l:'รหัสผ่านเดิม',t:'password',r:1},{k:'np',l:'รหัสผ่านใหม่ (อย่างน้อย 8 ตัว)',t:'password',r:1},{k:'np2',l:'ยืนยันรหัสผ่านใหม่',t:'password',r:1}],async f=>{
    if(f.np!=f.np2)return toast('รหัสผ่านใหม่ทั้งสองช่องไม่ตรงกัน');
    try{await api('changePass',{old:f.old,newPass:f.np});cred.pass=f.np;sessionStorage.setItem('c',JSON.stringify(cred));toast('เปลี่ยนรหัสผ่านแล้ว และส่งอีเมลแจ้งไปที่บัญชีของคุณ')}catch(e){}
  });
}

/* ---- ลูกเล่นและฟีเจอร์เสริม ---- */
try{document.documentElement.dataset.theme=localStorage.getItem('th')||'light'}catch(e){}
function toggleTheme(){const d=document.documentElement,t=d.dataset.theme=='dark'?'light':'dark';d.dataset.theme=t;try{localStorage.setItem('th',t)}catch(e){}}
let q='',sf='ทั้งหมด',mode='list';
const soon=l=>`<button class="soon" onclick="toast('“${l}” เร็ว ๆ นี้')">${l} <em>soon</em></button>`;
const left=c=>{if(!c.due||c.status=='ปิดเคส')return'';const n=days(c.due);return n<0?`เกิน ${-n} วัน`:n==0?'ครบกำหนดวันนี้':`อีก ${n} วัน`};
const doneDate=c=>{const l=c.log.slice().reverse().find(x=>/สถานะเป็น ปิดเคส/.test(x[2]));return l&&l[0]};
const vis=()=>S.cases.filter(c=>(sf=='ทั้งหมด'||c.status==sf||(sf=='เกินกำหนด'&&late(c)))&&(!q||[c.id,c.customer,c.part,c.sn,c.symptom].join(' ').toLowerCase().includes(q.toLowerCase())));
function listHTML(){
  const cs=vis();
  if(!cs.length)return `<div class="box empty">ไม่พบเคสที่ตรงกับตัวกรอง</div>`;
  if(mode=='board')return `<div class="board">${ST.map((s,k)=>{const col=cs.filter(c=>c.status==s);return `<div class="col" ondragover="event.preventDefault();this.classList.add('over')" ondragleave="this.classList.remove('over')" ondrop="dropCase(event,'${s}')"><div class="colh"><span class="chip s${k}">${s}</span><b>${col.length}</b></div>${col.map((c,i)=>`<div class="card" style="--i:${Math.min(i,10)}" ${staff()?`draggable="true" ondragstart="event.dataTransfer.setData('text','${c.id}')"`:''} onclick="cur='${c.id}';render()"><span class="sn">${esc(c.id)}</span><div>${esc(c.part)}</div><div class="log">${esc(c.customer)}</div><div class="${late(c)?'warn':'log'}">${left(c)}</div></div>`).join('')}</div>`}).join('')}</div>`;
  return `<div class="wide"><table><tr><th>เลขเคส</th><th>ลูกค้า</th><th>ชิ้นงาน / S/N</th><th>กำหนดเสร็จ</th><th>สถานะ</th></tr>${cs.map((c,i)=>`<tr class="k" style="--i:${Math.min(i,12)}" onclick="cur='${c.id}';render()"><td><span class="sn">${esc(c.id)}</span></td><td>${esc(c.customer)}</td><td>${esc(c.part)}<br><span class="log">${esc(c.sn)}</span></td><td>${esc(c.due)}<br><span class="${late(c)?'warn':'log'}">${left(c)}</span></td><td>${chip(c)}</td></tr>`).join('')}</table></div>`;
}
function dropCase(e,s){e.preventDefault();e.currentTarget.classList.remove('over');const id=e.dataTransfer.getData('text'),c=S.cases.find(x=>x.id==id);if(c&&c.status!=s)setSt(id,s)}
async function setSt(id,s){if(await act('saveCase',{c:{id,status:s}},'เปลี่ยนสถานะแล้ว')&&s=='ปิดเคส')confetti()}
function stepper(c){
  const p=[['D1–2','ปัญหา',c.symptom],['D3','กักกัน',c.d3],['D4','ทดสอบ',c.test],['D4','Root cause',c.rc],['D5','แก้ไข',c.d5],['D6','ยืนยัน',c.d6],['D7','ป้องกัน',c.d7],['D8','ปิดเคส',c.status=='ปิดเคส']],k=p.filter(x=>x[2]).length;
  return `<div class="stepper">${p.map(x=>`<div class="st ${x[2]?'ok':''}"><i></i><b>${x[0]}</b><span>${x[1]}</span></div>`).join('')}</div><div class="log">ความคืบหน้า 8D ${k}/${p.length}</div><div class="prog"><i style="width:${k/p.length*100}%"></i></div>`;
}
function exportCsv(){
  const H=['เลขเคส','ลูกค้า','อีเมล','ชิ้นงาน','S/N','อาการ','รับเมื่อ','กำหนด','สถานะ','ผู้รับผิดชอบ','Root cause'],
  f=v=>{v=String(v??'');return '"'+(/^[=+\-@]/.test(v)?"'":'')+v.replace(/"/g,'""')+'"'};
  const t='\ufeff'+[H,...vis().map(c=>[c.id,c.customer,c.custEmail,c.part,c.sn,c.symptom,c.received,c.due,c.status,c.owner,c.rc])].map(r=>r.map(f).join(',')).join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));a.download='fa-cases-'+today()+'.csv';a.click();
}
function after(){
  document.querySelectorAll('[data-n]').forEach(el=>{const t=+el.dataset.n,s=performance.now();(function f(now){const p=Math.min(1,(now-s)/700);el.textContent=Math.round(t*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)})(s)});
}
function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const cv=document.createElement('canvas');cv.className='conf';cv.width=innerWidth;cv.height=innerHeight;document.body.append(cv);
  const x=cv.getContext('2d'),C=['#2fb36d','#e0a21b','#3a82d6','#c0762f','#d9462f'],P=Array.from({length:120},()=>({x:innerWidth/2,y:innerHeight*.6,vx:(Math.random()-.5)*16,vy:-Math.random()*16-4,s:4+Math.random()*5,c:C[Math.random()*5|0],r:Math.random()*6}));
  let f=0;(function a(){x.clearRect(0,0,cv.width,cv.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.45;p.r+=.2;x.fillStyle=p.c;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore()});if(++f<110)requestAnimationFrame(a);else cv.remove()})();
}
function palOpen(){if(!S.u)return;$('#pal').showModal();$('#pq').value='';palList();$('#pq').focus()}
function palList(){
  const t=$('#pq').value.toLowerCase(),it=[...tabs().map(([k,l])=>({l:'ไปที่: '+l,f:`go('${k}')`})),...S.cases.map(c=>({l:`${c.id} · ${c.part} · ${c.customer}`,f:`cur='${c.id}';render()`}))].filter(x=>x.l.toLowerCase().includes(t)).slice(0,8);
  $('#pr').innerHTML=it.map((x,i)=>`<button class="${i?'':'on'}" onclick="$('#pal').close();${x.f}">${esc(x.l)}</button>`).join('')||'<div class="log" style="padding:10px">ไม่พบรายการ</div>';
}
addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()=='k'){e.preventDefault();palOpen()}});

/* ---- QR Code: แบบเฉพาะเคส / แบบแท็กวนใช้ + กรอกข้อมูลผ่านมือถือ ---- */
const F8=[['d3','D3 มาตรการกักกัน (Containment)'],['test','D4 ขั้นตอนทดสอบ / ผลที่พบ'],['rc','D4 สาเหตุราก (Root cause)'],['d5','D5 การแก้ไข (Corrective action)'],['d6','D6 การยืนยันผล'],['d7','D7 การป้องกันซ้ำ']];
let deep=(()=>{const p=new URLSearchParams(location.search);return p.get('c')?{k:'c',v:p.get('c')}:p.get('t')?{k:'t',v:p.get('t')}:null})(),mob=null;
function openDeep(){if(deep){mob=deep;deep=null}}
const mobTag=()=>mob&&mob.k=='t'?(S.tags||[]).find(x=>x.id==mob.v):null;
const mobCase=()=>mob&&S.cases.find(x=>x.id==(mob.k=='c'?mob.v:(mobTag()||{}).caseId));
function mobExit(){const c=mobCase();mob=null;cur=c?c.id:null;view='cases';render()}
function quickNote(id){const t=$('#qn').value.trim();if(t)act('note',{id,text:t},'บันทึกหมายเหตุแล้ว')}
function qrUrl(k,v){
  const b=(S.base||(/^https?:/.test(location.protocol)?location.origin+location.pathname:'')).trim();
  return b?b+(b.includes('?')?'&':'?')+k+'='+encodeURIComponent(v):'';
}
function qrSvg(t){
  for(let n=2;n<=20;n++){try{
    const q=new QRC.QRCode(n,QRC.ECC.M);q.addData(t);q.make();
    const N=q.getModuleCount(),m=2;let p='';
    for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(q.isDark(r,c))p+=`M${c+m} ${r+m}h1v1h-1z`;
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${N+2*m} ${N+2*m}" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="#fff"/><path d="${p}"/></svg>`;
  }catch(e){}}
  return '';
}
const baseWarn=()=>qrUrl('c','x')?'':`<div class="box warn" style="margin:0 0 14px">ยังไม่ได้ตั้ง URL ของหน้า LIMS — ให้ Manager ไปที่ “ตั้งค่าอีเมล” แล้วใส่ URL ที่ใช้เปิดระบบ (เช่น https://…/lims-fa.html) QR จึงจะเปิดจากมือถือได้ (เปิดไฟล์จากเครื่องโดยตรงใช้กับมือถือไม่ได้)</div>`;
const qrMode=id=>{try{return localStorage.getItem('qm:'+id)||localStorage.getItem('qm')||'case'}catch(e){return'case'}};
function setQr(id,m){try{localStorage.setItem('qm:'+id,m);localStorage.setItem('qm',m)}catch(e){}render()}
function qrPanel(c){
  const m=qrMode(c.id),T=S.tags||[],tag=T.find(t=>t.caseId==c.id),free=T.filter(t=>!t.caseId),
    v=m=='tag'?(tag&&tag.id):c.id,url=v?qrUrl(m=='tag'?'t':'c',v):'';
  const side=m=='case'?`<p><b>QR เฉพาะเคสนี้</b><br>ผูกกับเลขเคส ${esc(c.id)} ถาวร พิมพ์แล้วติดกับชิ้นงานหรือใบงาน สแกนแล้วเข้าเคสนี้เสมอ</p>`
   :tag?`<p><b>แท็กวนใช้ ${esc(tag.id)}</b> ผูกกับเคสนี้อยู่<br>ปิดเคสแล้วแท็กจะว่างและนำไปใช้กับเคสอื่นได้</p><button class="x" onclick="tagRel('${tag.id}')">ปล่อยแท็ก</button>`
   :`<p><b>แท็กวนใช้</b> เลือกแท็กที่ว่างเพื่อผูกกับเคสนี้</p>${free.length?`<div class="bar"><select id="tgsel">${free.map(t=>`<option>${esc(t.id)}</option>`).join('')}</select><button class="pri" onclick="act('tagAssign',{tag:$('#tgsel').value,caseId:'${c.id}'},'ผูกแท็กแล้ว')">ผูกแท็ก</button></div>`:'<p class="log">ไม่มีแท็กว่าง ให้ Manager สร้างที่หน้า “แท็ก QR”</p>'}`;
  return `<h2>QR Code สำหรับกรอกข้อมูลผ่านมือถือ</h2><div class="box"><div class="seg2"><button class="${m=='case'?'on':''}" onclick="setQr('${c.id}','case')">เฉพาะเคสนี้</button><button class="${m=='tag'?'on':''}" onclick="setQr('${c.id}','tag')">แท็กวนใช้</button></div>${baseWarn()}
  <div class="qrbody"><div class="qrimg">${url?qrSvg(url):''}</div><div>${side}<div class="bar"><button onclick="printQr('${c.id}')" ${url?'':'disabled'}>พิมพ์ป้าย</button><button onclick="copyQr('${c.id}')" ${url?'':'disabled'}>คัดลอกลิงก์</button></div></div></div></div>`;
}
function curQr(id){
  const c=S.cases.find(x=>x.id==id),m=qrMode(id),tag=(S.tags||[]).find(t=>t.caseId==id),v=m=='tag'?(tag&&tag.id):id;
  return {c,m,tag,url:v?qrUrl(m=='tag'?'t':'c',v):''};
}
function printLabels(items){
  const w=open('','_blank');
  w.document.write(`<title>QR</title><meta charset="utf-8"><style>body{font-family:Tahoma,sans-serif;margin:8mm}.g{display:grid;grid-template-columns:repeat(auto-fill,52mm);gap:4mm}.l{width:52mm;border:1px dashed #999;padding:3mm;text-align:center;break-inside:avoid}.l svg{width:40mm;height:40mm}.l b{display:block;font:700 13pt monospace}.l small{display:block;font-size:9pt;line-height:1.25}</style><div class="g">${items.map(i=>`<div class="l">${qrSvg(i.url)}<b>${esc(i.big)}</b><small>${esc(i.small||'')}</small></div>`).join('')}</div>`);
  w.document.close();setTimeout(()=>w.print(),600);
}
function printQr(id){
  const {c,m,tag,url}=curQr(id);
  if(!url)return toast(m=='tag'?'ยังไม่ได้ผูกแท็กกับเคสนี้':'ยังไม่ได้ตั้ง URL ของหน้า LIMS');
  printLabels([{url,big:m=='tag'?tag.id:c.id,small:`${c.part} · ${c.customer}`}]);
}
function printTags(id){
  const T=(S.tags||[]).filter(t=>id?t.id==id:!t.caseId);
  if(!qrUrl('t','x'))return toast('ยังไม่ได้ตั้ง URL ของหน้า LIMS');
  printLabels(T.map(t=>({url:qrUrl('t',t.id),big:t.id,small:'สแกนเพื่อกรอกข้อมูลเคส'})));
}
function copyQr(id){const u=curQr(id).url;navigator.clipboard.writeText(u).then(()=>toast('คัดลอกลิงก์แล้ว'),()=>toast(u))}
function tagNew(){dlg('สร้างแท็กใหม่',[{k:'n',l:'จำนวนแท็ก (1–100)',t:'number',v:10,r:1}],f=>act('tagCreate',{n:+f.n},'สร้างแท็กแล้ว'))}
function tagRel(id){act('tagRelease',{tag:id},'ปล่อยแท็กแล้ว')}

if(cred)load().catch(()=>{cred=null;render()});else render();
</script>
